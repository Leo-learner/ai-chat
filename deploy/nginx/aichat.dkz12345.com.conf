server {
    listen 443 ssl;
    server_name aichat.dkz12345.com;
    client_max_body_size 256k;

    include /etc/nginx/snippets/dkz12345-security-blocks.conf;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 310s;
    }

    ssl_certificate /etc/letsencrypt/live/aichat.dkz12345.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aichat.dkz12345.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name aichat.dkz12345.com;
    return 301 https://$host$request_uri;
}
