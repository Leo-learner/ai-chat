<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #030306;
      --surface:  rgba(255,255,255,0.026);
      --border:   rgba(255,255,255,0.06);
      --border-h: rgba(255,255,255,0.11);
      --text:     #d8dce8;
      --muted:    rgba(255,255,255,0.28);
      --vol:      #38bdf8;
      --bri:      #fb923c;
      --on:       #4ade80;
      --off:      rgba(255,255,255,0.1);
      --danger:   #f87171;
      --ring-a:   #818cf8;
      --ring-b:   #c084fc;
      --r:        18px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: clamp(20px, 4vw, 44px);
      /* subtle ambient glow */
      background-image:
        radial-gradient(ellipse 55% 40% at 8% 30%,  rgba(56,189,248,0.055) 0%, transparent 60%),
        radial-gradient(ellipse 45% 50% at 88% 15%,  rgba(192,132,252,0.05) 0%, transparent 55%),
        radial-gradient(ellipse 50% 45% at 55% 95%,  rgba(74,222,128,0.04) 0%, transparent 55%);
    }

    /* ── Page header ─────────────────────────────────── */

    header {
      max-width: 980px;
      margin: 0 auto 32px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    header h1 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    header .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--on);
      box-shadow: 0 0 8px var(--on);
      flex-shrink: 0;
      margin-bottom: 1px;
    }

    /* ── Grid ────────────────────────────────────────── */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto auto auto;
      gap: 14px;
      max-width: 980px;
      margin: 0 auto;
    }

    /* apps spans 2 cols, row 2 */
    .apps-card  { grid-column: 1 / 3; }
    /* VPN spans all 3 cols, row 3 */
    .vpn-card   { grid-column: 1 / 4; }

    @media (max-width: 740px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .apps-card { grid-column: 1 / 3; }
      .vpn-card  { grid-column: 1 / 3; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .apps-card, .vpn-card { grid-column: unset; }
    }

    /* ── Card ────────────────────────────────────────── */

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s;
      animation: rise 0.45s cubic-bezier(0.22,1,0.36,1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(140deg, rgba(255,255,255,0.025) 0%, transparent 55%);
      pointer-events: none;
    }

    .card:hover { border-color: var(--border-h); }

    .card:nth-child(1) { animation-delay: 0.04s; }
    .card:nth-child(2) { animation-delay: 0.09s; }
    .card:nth-child(3) { animation-delay: 0.14s; }
    .card:nth-child(4) { animation-delay: 0.19s; }
    .card:nth-child(5) { animation-delay: 0.24s; }
    .card:nth-child(6) { animation-delay: 0.29s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Label ───────────────────────────────────────── */

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* ── Slider ──────────────────────────────────────── */

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .slider-icon {
      flex-shrink: 0;
      opacity: 0.35;
    }

    .slider-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      min-width: 30px;
      text-align: right;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: var(--border);
    }

    input[type=range].vol {
      background: linear-gradient(to right,
        var(--vol) var(--fill, 50%),
        rgba(255,255,255,0.07) var(--fill, 50%));
    }

    input[type=range].bri {
      background: linear-gradient(to right,
        var(--bri) var(--fill, 70%),
        rgba(255,255,255,0.07) var(--fill, 70%));
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px; height: 17px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 2px 10px rgba(0,0,0,0.7);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    input[type=range]:active::-webkit-slider-thumb {
      transform: scale(1.18);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.1), 0 2px 14px rgba(0,0,0,0.7);
    }

    input[type=range]:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Mute icon button ────────────────────────────── */

    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover  { border-color: var(--border-h); color: var(--text); }
    .icon-btn.muted  { border-color: rgba(248,113,113,0.5); color: var(--danger); }

    /* ── Memory ring ─────────────────────────────────── */

    .mem-body {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ring-wrap {
      position: relative;
      flex-shrink: 0;
      width: 84px; height: 84px;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
      width: 84px; height: 84px;
    }

    .ring-bg   { fill: none; stroke: var(--border); stroke-width: 5; }
    .ring-fill {
      fill: none;
      stroke: url(#rg);
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1);
    }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1px;
    }

    .ring-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
    }

    .ring-sub {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mem-stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .mem-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mem-key {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .mem-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    /* ── Apps ────────────────────────────────────────── */

    .app-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .inp {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .inp::placeholder { color: rgba(255,255,255,0.18); }
    .inp:focus { border-color: rgba(56,189,248,0.4); }

    .btn {
      border: 1px solid rgba(56,189,248,0.25);
      background: rgba(56,189,248,0.09);
      border-radius: 10px;
      padding: 8px 16px;
      color: var(--vol);
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(56,189,248,0.16); }

    .btn-ghost {
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 10px;
      padding: 8px 13px;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--border-h); color: var(--text); }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 108px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .chip-list::-webkit-scrollbar       { width: 3px; }
    .chip-list::-webkit-scrollbar-track { background: transparent; }
    .chip-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px 4px 11px;
      font-size: 12px;
      transition: border-color 0.2s;
    }
    .chip:hover { border-color: var(--border-h); }

    .chip-x {
      width: 15px; height: 15px;
      border-radius: 50%;
      background: rgba(248,113,113,0.12);
      border: none;
      color: rgba(248,113,113,0.6);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
      line-height: 1;
    }
    .chip-x:hover { background: rgba(248,113,113,0.28); color: var(--danger); }

    /* ── Toggle ──────────────────────────────────────── */

    .toggle-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .toggle-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      transition: color 0.3s;
    }

    .tog {
      position: relative;
      width: 46px; height: 26px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tog input { position: absolute; opacity: 0; width: 0; height: 0; }

    .tog-track {
      position: absolute;
      inset: 0;
      border-radius: 13px;
      background: var(--off);
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.3s, border-color 0.3s;
    }
    .tog input:checked ~ .tog-track {
      background: var(--on);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(74,222,128,0.35);
    }

    .tog-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.5);
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    .tog input:checked ~ .tog-thumb { transform: translateX(20px); }

    /* ── VPN ─────────────────────────────────────────── */

    .vpn-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 32px;
    }

    .vpn-item {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1 1 220px;
      min-width: 0;
    }

    .vpn-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .vpn-dot.on {
      background: var(--on);
      box-shadow: 0 0 7px var(--on);
    }

    .vpn-name {
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vpn-empty {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="dot" id="liveDot"></div>
    <h1>System</h1>
  </header>

  <div class="grid">

    <!-- ── Volume ─────────────────────── -->
    <div class="card">
      <div class="label">Volume</div>
      <div class="slider-row">
        <button class="icon-btn" id="muteBtn" onclick="toggleMute()">
          <!-- speaker icon -->
          <svg id="speakerIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
        </button>
        <input type="range" class="vol" id="volSlider" min="0" max="100" value="50"
          oninput="syncSlider(this,'vol')" onchange="setVolume(this.value)">
        <span class="slider-val" id="volVal">50</span>
      </div>
    </div>

    <!-- ── Brightness ─────────────────── -->
    <div class="card">
      <div class="label">Brightness</div>
      <div class="slider-row">
        <svg class="slider-icon" width="15" height="15" viewBox="0 0 24 24" fill="var(--bri)">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-5c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1V3c0-.55.45-1 1-1zm0 18c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1 1 1zM5.64 6.35c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0l1.06 1.06c.39.39.39 1.02 0 1.41-.38.39-1.02.39-1.41 0L5.64 6.35zm11.31 11.3c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0l1.06 1.06c.39.39.39 1.02 0 1.41-.39.38-1.02.38-1.41 0l-1.06-1.06zm1.06-11.3l-1.06 1.06c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41l1.06-1.06c.39-.39 1.02-.39 1.41 0 .38.39.38 1.02 0 1.41zM7.11 17.65l-1.06 1.06c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41l1.06-1.06c.39-.39 1.02-.39 1.41 0 .38.39.38 1.02 0 1.41zM3 12c0-.55.45-1 1-1h2c.55 0 1 .45 1 1s-.45 1-1 1H4c-.55 0-1-.45-1-1zm15 0c0-.55.45-1 1-1h2c.55 0 1 .45 1 1s-.45 1-1 1h-2c-.55 0-1-.45-1-1z"/>
        </svg>
        <input type="range" class="bri" id="briSlider" min="0" max="100" value="70"
          oninput="syncSlider(this,'bri')" onchange="setBrightness(this.value)">
        <span class="slider-val" id="briVal">70</span>
      </div>
    </div>

    <!-- ── Memory ─────────────────────── -->
    <div class="card">
      <div class="label">Memory</div>
      <div class="mem-body">
        <div class="ring-wrap">
          <svg viewBox="0 0 84 84">
            <defs>
              <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="var(--ring-a)"/>
                <stop offset="100%" stop-color="var(--ring-b)"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="42" cy="42" r="33"/>
            <circle class="ring-fill" id="memRing" cx="42" cy="42" r="33"
              stroke-dasharray="207.3" stroke-dashoffset="207.3"/>
          </svg>
          <div class="ring-label">
            <div class="ring-pct" id="memPct">—</div>
            <div class="ring-sub">RAM</div>
          </div>
        </div>
        <div class="mem-stats">
          <div class="mem-row"><span class="mem-key">Used</span><span class="mem-val" id="mUsed">—</span></div>
          <div class="mem-row"><span class="mem-key">Free</span><span class="mem-val" id="mFree">—</span></div>
          <div class="mem-row"><span class="mem-key">Total</span><span class="mem-val" id="mTotal">—</span></div>
        </div>
      </div>
    </div>

    <!-- ── Apps ───────────────────────── -->
    <div class="card apps-card">
      <div class="label">Apps</div>
      <div class="app-input-row">
        <input class="inp" id="appInp" type="text" placeholder="App name…"
          onkeydown="if(event.key==='Enter') openApp()">
        <button class="btn" onclick="openApp()">Open</button>
        <button class="btn-ghost" onclick="loadApps()">↺</button>
      </div>
      <div class="chip-list" id="chipList"></div>
    </div>

    <!-- ── Bluetooth ──────────────────── -->
    <div class="card">
      <div class="label">Bluetooth</div>
      <div class="toggle-body">
        <span class="toggle-status" id="btLabel">—</span>
        <label class="tog">
          <input type="checkbox" id="btToggle" onchange="setBluetooth(this.checked)">
          <div class="tog-track"></div>
          <div class="tog-thumb"></div>
        </label>
      </div>
    </div>

    <!-- ── VPN ────────────────────────── -->
    <div class="card vpn-card">
      <div class="label">VPN</div>
      <div class="vpn-inner" id="vpnInner">
        <span class="vpn-empty">Loading…</span>
      </div>
    </div>

  </div><!-- .grid -->

<script>
/* ── helpers ──────────────────────────────────────── */

const $ = id => document.getElementById(id)

function gb(b) {
  const v = b / 1073741824
  return v >= 1 ? v.toFixed(1) + ' GB' : (b / 1048576).toFixed(0) + ' MB'
}

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } }
  if (body) opts.body = JSON.stringify(body)
  try {
    const r = await fetch(path, opts)
    return await r.json()
  } catch { return {} }
}

/* ── Volume ───────────────────────────────────────── */

let muted = false

function syncSlider(el, cls) {
  el.style.setProperty('--fill', el.value + '%')
  $(cls === 'vol' ? 'volVal' : 'briVal').textContent = el.value
}

async function setVolume(v) {
  await api('/api/volume', 'POST', { volume: +v })
}

async function toggleMute() {
  muted = !muted
  $('muteBtn').classList.toggle('muted', muted)
  $('volSlider').disabled = muted
  // swap icon path
  $('speakerIcon').innerHTML = muted
    ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
    : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>'
  await api('/api/volume/mute', 'POST', { muted })
}

async function loadVolume() {
  const d = await api('/api/volume')
  if (!d.volume && d.volume !== 0) return
  $('volSlider').value = d.volume
  syncSlider($('volSlider'), 'vol')
  muted = d.muted
  $('muteBtn').classList.toggle('muted', muted)
  $('volSlider').disabled = muted
}

/* ── Brightness ───────────────────────────────────── */

async function setBrightness(v) {
  await api('/api/brightness', 'POST', { brightness: +v })
}

async function loadBrightness() {
  const d = await api('/api/brightness')
  if (!d.brightness && d.brightness !== 0) return
  $('briSlider').value = d.brightness
  syncSlider($('briSlider'), 'bri')
}

/* ── Memory (SocketIO) ────────────────────────────── */

const CIRC = 207.3  // 2π × 33

function renderMem(d) {
  const pct = d.percent
  $('memRing').style.strokeDashoffset = CIRC * (1 - pct / 100)
  $('memPct').textContent = Math.round(pct) + '%'
  $('mUsed').textContent  = gb(d.used)
  $('mFree').textContent  = gb(d.available)
  $('mTotal').textContent = gb(d.total)
}

const socket = io()
socket.on('memory', renderMem)
socket.on('connect', () => { $('liveDot').style.opacity = '1' })
socket.on('disconnect', () => { $('liveDot').style.opacity = '0.3' })

/* ── Apps ─────────────────────────────────────────── */

async function loadApps() {
  const d = await api('/api/apps')
  const list = $('chipList')
  list.innerHTML = ''
  ;(d.apps || []).forEach(name => {
    const safe = name.replace(/'/g, "\\'").replace(/"/g, '&quot;')
    const chip = document.createElement('div')
    chip.className = 'chip'
    chip.innerHTML = `<span>${name}</span>
      <button class="chip-x" onclick="closeApp('${safe}')">✕</button>`
    list.appendChild(chip)
  })
}

async function openApp() {
  const name = $('appInp').value.trim()
  if (!name) return
  await api('/api/apps/open', 'POST', { app: name })
  $('appInp').value = ''
  setTimeout(loadApps, 900)
}

async function closeApp(name) {
  await api('/api/apps/close', 'POST', { app: name })
  setTimeout(loadApps, 600)
}

/* ── Bluetooth ────────────────────────────────────── */

async function loadBluetooth() {
  const d = await api('/api/bluetooth')
  const on = !!d.enabled
  $('btToggle').checked = on
  $('btLabel').textContent = on ? 'On' : 'Off'
  $('btLabel').style.color = on ? 'var(--on)' : 'var(--muted)'
}

async function setBluetooth(on) {
  $('btLabel').textContent = on ? 'On' : 'Off'
  $('btLabel').style.color = on ? 'var(--on)' : 'var(--muted)'
  await api('/api/bluetooth', 'POST', { enabled: on })
}

/* ── VPN ──────────────────────────────────────────── */

async function loadVPN() {
  const d = await api('/api/vpn')
  const inner = $('vpnInner')
  if (!d.vpns || !d.vpns.length) {
    inner.innerHTML = '<span class="vpn-empty">No VPN configured</span>'
    return
  }
  inner.innerHTML = ''
  d.vpns.forEach(v => {
    const safeName = v.name.replace(/'/g, "\\'")
    const item = document.createElement('div')
    item.className = 'vpn-item'
    item.innerHTML = `
      <div class="vpn-dot ${v.connected ? 'on' : ''}"></div>
      <span class="vpn-name">${v.name}</span>
      <label class="tog">
        <input type="checkbox" ${v.connected ? 'checked' : ''}
          onchange="toggleVPN('${safeName}', this.checked)">
        <div class="tog-track"></div>
        <div class="tog-thumb"></div>
      </label>`
    inner.appendChild(item)
  })
}

async function toggleVPN(name, connect) {
  await api('/api/vpn/toggle', 'POST', { name, connect })
  setTimeout(loadVPN, 1800)
}

/* ── Init ─────────────────────────────────────────── */

Promise.allSettled([
  loadVolume(),
  loadBrightness(),
  loadApps(),
  loadBluetooth(),
  loadVPN(),
])

// periodic refresh
setInterval(loadApps,     8000)
setInterval(loadBluetooth, 6000)
setInterval(loadVPN,       8000)
</script>
</body>
</html>
