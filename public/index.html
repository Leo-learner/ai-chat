<!DOCTYPE html>
<html id="dialogueApp" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>AI Dialogue</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="favicon-dark.ico" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css?v=20260829">
  <script src="vendor/marked.min.js"></script>
  <link rel="stylesheet" href="vendor/github-dark.min.css">
</head>
<body class="selected-ui server-chat-only">
  <!-- ========== Auth View ========== -->
  <div id="authView" class="view hidden">
    <section class="auth-scene">
      <div class="auth-hero">
        <div class="brand-mark">
          <span class="brand-dot"></span>
          <span class="brand-dot brand-dot-secondary"></span>
        </div>
        <h1>AI Dialogue</h1>
        <p>轻巧、连续、适合手机使用的私人 AI 工作台。</p>

      </div>

      <div class="auth-panel">
        <div class="auth-card">
          <div class="auth-header">
            <h2>欢迎回来</h2>
            <p>登录后继续你的对话。</p>
          </div>

          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">登录</button>
            <button class="auth-tab" data-tab="register">注册</button>
          </div>

          <form id="loginForm" class="auth-form">
            <div class="input-group">
              <label>用户名或邮箱</label>
              <input type="text" id="loginUser" placeholder="输入用户名或邮箱" autocomplete="username">
            </div>
            <div class="input-group">
              <label>密码</label>
              <input type="password" id="loginPass" placeholder="输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">登录</button>
            <p id="loginError" class="error-msg hidden"></p>
          </form>

          <form id="registerForm" class="auth-form hidden">
            <div class="input-group">
              <label>用户名</label>
              <input type="text" id="regUser" placeholder="设置用户名" autocomplete="username" minlength="2" maxlength="30">
            </div>
            <div class="input-group">
              <label>邮箱</label>
              <input type="email" id="regEmail" placeholder="输入邮箱" autocomplete="email">
            </div>
            <div class="input-group">
              <label>密码</label>
              <input type="password" id="regPass" placeholder="至少 6 位字符" autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full">创建账号</button>
            <p id="regError" class="error-msg hidden"></p>
          </form>
        </div>
      </div>
    </section>
  </div>

  <!-- ========== Chat View ========== -->
  <div id="chatView" class="view hidden">
    <div class="shell">
      <nav class="dialogue-rail" aria-label="主导航">
        <button id="railChatBtn" class="rail-button rail-brand" type="button" title="当前对话" aria-label="当前对话"><span class="ui-icon icon-chat" aria-hidden="true"></span></button>
        <div class="rail-links">
          <button id="railNewChatBtn" class="rail-button" type="button" title="新对话" aria-label="新对话"><span class="ui-icon icon-plus" aria-hidden="true"></span></button>
          <button id="railHistoryBtn" class="rail-button" type="button" title="历史会话" aria-label="历史会话" aria-controls="sidebar" aria-expanded="false"><span class="ui-icon icon-history" aria-hidden="true"></span></button>
          <button id="railSearchBtn" class="rail-button" type="button" title="搜索会话" aria-label="搜索会话" aria-controls="sidebar" aria-expanded="false"><span class="ui-icon icon-search" aria-hidden="true"></span></button>
        </div>
        <button id="settingsBtn" class="rail-button rail-settings" type="button" title="设置" aria-label="设置"><span class="ui-icon icon-settings" aria-hidden="true"></span></button>
      </nav>
      <aside id="sidebar" role="dialog" aria-modal="true" aria-label="历史会话">
        <div class="sidebar-top">
          <div class="sidebar-title-row">
            <div>
              <h3>历史会话</h3>
            </div>
            <div class="sidebar-actions">
              <button id="closeHistoryBtn" class="icon-btn" type="button" title="关闭历史会话" aria-label="关闭历史会话"><span class="ui-icon icon-close" aria-hidden="true"></span></button>
              <button id="logoutBtn" class="icon-btn hidden" title="退出登录" tabindex="-1" hidden>↗</button>
            </div>
          </div>
          <button id="newChatBtn" class="btn btn-primary btn-full new-chat-btn" title="新建对话">
            <span class="icon">＋</span>
            <span>新对话</span>
          </button>
        </div>

        <div class="sidebar-chats-wrap">
          <div class="chat-search-shell">
            <input id="chatSearchInput" class="chat-search-input" type="search" placeholder="搜索会话…">
          </div>
          <div class="sidebar-section-label" id="sidebarSectionLabel">
            <span>会话</span>
            <button id="batchSelectBtn" class="batch-select-btn" type="button" title="批量管理">管理</button>
          </div>
          <div class="sidebar-chats" id="chatList"></div>
          <div id="chatSearchEmpty" class="chat-search-empty hidden">没有匹配的会话</div>
          <div id="batchActionBar" class="batch-action-bar hidden">
            <span id="batchCount" class="batch-count">已选 0 个</span>
            <button id="batchDeleteBtn" class="btn btn-danger btn-sm" type="button">删除所选</button>
            <button id="batchCancelBtn" class="btn btn-ghost btn-sm" type="button">取消</button>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="user-card">
            <div class="user-avatar" id="userAvatar"></div>
            <div class="user-meta">
              <span class="user-name" id="userName"></span>
              <span class="user-sub">已登录</span>
            </div>
          </div>
        </div>
      </aside>

      <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

      <main id="main">
        <div class="main-frame">
          <header class="main-header">
            <span class="dialogue-wordmark">AI Dialogue</span>
            <div class="main-title-block">
              <button id="mobileSidebarBtn" class="icon-btn mobile-only" type="button" title="历史会话" aria-label="历史会话" aria-controls="sidebar" aria-expanded="false"><span class="ui-icon icon-chat" aria-hidden="true"></span></button>
              <div class="main-title-copy" id="mainTitleCopy">
                <h1 role="button" tabindex="0" title="重命名会话">新对话</h1>
                <input id="chatTitleInput" class="chat-title-edit" type="text" maxlength="80" placeholder="会话标题…" aria-label="会话标题" style="display:none">
                <button id="titleHistoryBtn" class="icon-btn title-history" type="button" title="切换会话" aria-label="切换会话" aria-controls="sidebar" aria-expanded="false"><span class="ui-icon icon-chevron" aria-hidden="true"></span></button>
              </div>
            </div>
            <div class="header-actions">
              <!-- Model selection is intentionally hidden: a single server-configured
                   model is used and no provider/model info is exposed in the UI.
                   The element is kept (not removed) because the chat logic reads
                   modelSelect.value; an empty value resolves to the server default. -->
              <select id="modelSelect" class="model-select" hidden aria-hidden="true" tabindex="-1">
                <option value="">default</option>
              </select>
              <button id="mobileNewChatBtn" class="icon-btn mobile-only" type="button" title="新建对话" aria-label="新建对话"><span class="ui-icon icon-plus" aria-hidden="true"></span></button>
              <button id="mobileMoreBtn" class="icon-btn mobile-only mobile-more-btn" type="button" title="菜单" aria-label="打开菜单" aria-controls="mobileMoreMenu" aria-expanded="false">⋯</button>
            </div>
          </header>

          <section class="content-stage">
            <div id="tabChat">
              <div id="emptyState" class="empty-state">
                <h2>今天想聊点什么？</h2>
                <p class="empty-memory-hint">直接在下方输入，开始对话。</p>
              </div>
              <div id="messagesContainer" class="messages-container hidden" role="region" aria-label="对话记录" tabindex="0"></div>
            </div>
          </section>

          <button id="scrollToBottomBtn" class="scroll-bottom-btn hidden" type="button" title="回到最新" aria-label="回到最新">↓</button>

          <footer id="inputArea" class="input-area">
            <div class="composer-shell">
              <button id="webSearchToggle" class="web-search-toggle hidden" type="button" aria-pressed="false" title="联网搜索未配置" disabled hidden>
                <span class="web-search-icon">⌕</span>
                <span class="web-search-label">联网</span>
              </button>
              <textarea
                id="messageInput"
                class="message-input"
                placeholder="输入消息…"
                aria-label="输入消息"
                title="Enter 发送，Shift+Enter 换行"
                rows="1"
              ></textarea>
              <button id="sendBtn" class="btn btn-primary btn-send" type="button" aria-label="发送消息" title="发送消息" disabled>
                <span class="ui-icon icon-send" aria-hidden="true"></span>
              </button>
              <button id="stopBtn" class="btn btn-stop btn-send hidden" type="button" title="中止回答" aria-label="停止生成">
                <span class="stop-square" aria-hidden="true"></span>
              </button>
            </div>
          </footer>
        </div>
      </main>
    </div>
    <div id="mobileMoreBackdrop" class="mobile-more-backdrop mobile-only hidden"></div>
    <div id="mobileMoreMenu" class="mobile-more-menu mobile-only hidden" role="dialog" aria-modal="true" aria-label="更多操作">
      <div class="mobile-more-head">
        <div>
          <div class="mobile-more-kicker">Menu</div>
          <div class="mobile-more-title">更多</div>
        </div>
        <button id="closeMobileMoreBtn" class="icon-btn" type="button" title="关闭">✕</button>
      </div>
      <div class="mobile-more-group mobile-more-session-group">
        <div class="mobile-more-group-label">会话</div>
        <div class="mobile-more-section mobile-more-session-actions">
          <button class="mobile-more-item mobile-more-primary" type="button" data-mobile-action="sidebar">会话列表</button>
          <button class="mobile-more-item mobile-more-primary" type="button" data-mobile-action="new-chat">新对话</button>
          <button class="mobile-more-item" type="button" data-mobile-action="settings">设置</button>
        </div>
      </div>
      <div class="mobile-more-group mobile-more-theme-group">
        <div class="mobile-more-group-label">
          <span>外观</span>
          <span id="themeCurrentLabel" class="mobile-more-group-value">跟随系统</span>
        </div>
        <div class="mobile-more-section mobile-more-theme-actions" role="group" aria-label="外观">
          <button class="mobile-more-item theme-choice" type="button" data-theme-choice="system" aria-pressed="false">跟随</button>
          <button class="mobile-more-item theme-choice" type="button" data-theme-choice="light" aria-pressed="false">浅色</button>
          <button class="mobile-more-item theme-choice" type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== Settings ========== -->
  <div id="settingsBackdrop" class="settings-backdrop hidden"></div>
  <div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-label="设置">
    <div class="settings-head">
      <div>
        <div class="settings-kicker">Settings</div>
        <div class="settings-title">设置</div>
      </div>
      <button id="closeSettingsBtn" class="icon-btn" type="button" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="settings-body">
      <section class="settings-section">
        <div class="settings-section-title">外观</div>
        <div class="settings-theme" role="group" aria-label="外观">
          <button class="settings-theme-btn theme-choice" type="button" data-theme-choice="system" aria-pressed="false">跟随系统</button>
          <button class="settings-theme-btn theme-choice" type="button" data-theme-choice="light" aria-pressed="false">浅色</button>
          <button class="settings-theme-btn theme-choice" type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
        </div>
      </section>

      <form id="settingsForm" class="settings-section" autocomplete="off">
        <div class="settings-section-title">账号</div>
        <div class="input-group">
          <label for="settingsUsername">用户名</label>
          <input type="text" id="settingsUsername" autocomplete="username" minlength="2" maxlength="30" placeholder="用户名">
        </div>

        <div class="settings-divider"></div>
        <div class="settings-subtle">修改密码（不修改可留空）</div>
        <div class="input-group">
          <label for="settingsNewPassword">新密码</label>
          <input type="password" id="settingsNewPassword" autocomplete="new-password" minlength="6" placeholder="至少 6 位，留空表示不修改">
        </div>
        <div class="input-group">
          <label for="settingsConfirmPassword">确认新密码</label>
          <input type="password" id="settingsConfirmPassword" autocomplete="new-password" placeholder="再次输入新密码">
        </div>

        <div class="settings-divider"></div>
        <div class="input-group">
          <label for="settingsCurrentPassword">当前密码</label>
          <input type="password" id="settingsCurrentPassword" autocomplete="current-password" placeholder="保存修改需验证当前密码">
        </div>

        <p id="settingsMessage" class="settings-message hidden"></p>
        <div class="settings-actions">
          <button type="submit" class="btn btn-primary" id="settingsSaveBtn">保存修改</button>
        </div>
      </form>

      <section class="settings-section">
        <p class="settings-subtle">Enter 发送 · Shift+Enter 换行<br>AI 可能出错，重要信息请核对。</p>
        <button id="settingsLogoutBtn" class="btn btn-ghost btn-full" type="button">退出登录</button>
      </section>
    </div>
  </div>
  <script type="module" src="app.mjs?v=20260830"></script>
</body>
</html>
